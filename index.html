<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Ball Playground</title>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <nav id="toolbar">
      <!-- Tool buttons are added here from the list in src/tools/index.ts. -->
      <span class="divider"></span>
      <button id="follow" title="Camera follows the ball">
        🎥<span>Follow</span>
      </button>
      <button id="home" title="Back to the start">🏠<span>Home</span></button>
      <button id="clear" title="Clear everything">🗑️<span>Clear</span></button>
    </nav>
    <div id="tool-menu" hidden></div>
    <p id="hint"></p>
    <button id="bg-button" title="Change the background">🎨</button>
    <div id="bg-picker" hidden></div>
    <button id="saves-button" title="Save this playground, or load a saved one">
      🖼️
    </button>
    <div id="saves-panel" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
